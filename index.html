async function loadClassroomPosts(){if(!currentUser){classroomPosts=[];classroomComments=[];paintThreadBoard();return}const {data,error}=await db.from('classroom_threads_posts').select('id,user_id,url,created_at,display_start,display_end').order('display_start',{ascending:true}).limit(100);if(error){console.warn('게시글 조회 실패',error.message);return}classroomPosts=data||[];const ids=classroomPosts.map(p=>p.id);if(ids.length){const r=await db.from('classroom_thread_comments').select('id,post_id,user_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(300);classroomComments=r.data||[]}else classroomComments=[];paintThreadBoard();renderClassroomPosts()}
function renderClassroomPosts(){const list=document.getElementById('postList');if(!list)return;list.replaceChildren();const active=activeThread();for(const p of classroomPosts){const row=document.createElement('div');row.style.cssText='padding:12px;margin:10px 0;border:1px solid #6397a8;border-radius:10px';const state=p.id===active?.id?'🔴 현재 전시 중':new Date(p.display_end)<=new Date()?'완료':'⏳ 대기 중';const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🧵 '+p.url;row.append(document.createTextNode(state+' · '+new Date(p.display_start).toLocaleString('ko-KR')+' ~ '+new Date(p.display_end).toLocaleString('ko-KR')),document.createElement('br'),a);for(const c of classroomComments.filter(c=>c.post_id===p.id)){const line=document.createElement('p');line.textContent='💬 '+c.body;row.append(line)}if(p.id===active?.id){const input=document.createElement('input');input.placeholder='응원이나 피드백 댓글 (500자 이내)';input.maxLength=500;input.dataset.commentInput=String(p.id);const btn=document.createElement('button');btn.textContent='댓글 남기기';btn.dataset.commentPost=String(p.id);row.append(input,btn)}list.append(row)}if(!classroomPosts.length)list.textContent='신청된 게시글이 없습니다. 위 링크는 운영자가 추천한 첫 글입니다.'}
document.getElementById('posts').onclick=async()=>{if(!currentUser){authView();return}open('💬 Threads 4시간 피드백','<p>게시글은 선착순으로 4시간씩 전시돼요. 다른 회원은 게시판에서 댓글을 남길 수 있습니다.</p><input id="postUrl" placeholder="https://www.threads.com/..." /><p><button id="addPost">선착순 전시 신청</button></p><p id="postFeedback"></p><div id="postList"></div>');await loadClassroomPosts()};
document.addEventListener('click',async e=>{if(e.target.id==='addPost'){const input=document.getElementById('postUrl'),feedback=document.getElementById('postFeedback');if(!input||!currentUser)return;let u;try{u=new URL(input.value.trim());if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname)||u.pathname==='/')throw 0}catch{feedback.textContent='올바른 Threads 링크를 입력해 주세요.';return}e.target.disabled=true;const {error}=await db.rpc('submit_classroom_thread',{p_url:u.href});e.target.disabled=false;feedback.textContent=error?'신청 실패: '+error.message:'신청 완료! 대기 순서에 따라 4시간씩 전시됩니다.';if(!error){input.value='';await loadClassroomPosts()}}const postId=e.target.dataset?.commentPost;if(postId&&currentUser){const input=document.querySelector('[data-comment-input="'+postId+'"]');const body=input?.value.trim();if(!body||body.length>500)return;e.target.disabled=true;const {error}=await db.from('classroom_thread_comments').insert({post_id:Number(postId),user_id:currentUser.id,body});e.target.disabled=false;if(error)alert('댓글 등록 실패: '+error.message);else await loadClassroomPosts()}});
const screenRay=new T.Raycaster(),screenPointer=new T.Vector2();r.domElement.addEventListener('click',e=>{if(document.getElementById('modal').classList.contains('show'))return;const rect=r.domElement.getBoundingClientRect();screenPointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1);screenRay.setFromCamera(screenPointer,c);const hit=screenRay.intersectObjects([lectureScreen,threadBoardMesh])[0];if(!hit)return;if(hit.object===lectureScreen)document.getElementById('watch').click();else if(currentUser){affiliateOpen()}else{const url=activeThread()?.url||FEATURED_THREAD;open('💬 지금 전시 중인 Threads 글','<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Threads 원본 게시글 열기</a></p><p>회원 댓글과 다음 게시글 신청은 게시글 토론에서 확인하세요.</p><button id="goThreadBoard">💬 게시판 열기</button>')}});
document.addEventListener('click',e=>{if(e.target.id==='goThreadBoard')document.getElementById('posts').click()});paintThreadBoard();setInterval(()=>{if(currentUser)loadAffiliate();paintThreadBoard();if(!document.hidden)loadClassroomPosts()},10000);db.channel('booup-threads-board').on('postgres_changes',{event:'*',schema:'public',table:'classroom_threads_posts'},()=>loadClassroomPosts()).subscribe();
let overview=false;document.getElementById('overview').onclick=()=>{overview=!overview;document.getElementById('overview').textContent=overview?'↩ 아바타 따라가기':'◎ 전체 보기'};document.getElementById('home').onclick=()=>{player.position.set(0,.5,15);yaw=0;overview=false;document.getElementById('overview').textContent='◎ 전체 보기'};
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let x=0,z=0;if(keys.has('w')||keys.has('arrowup'))z--;if(keys.has('s')||keys.has('arrowdown'))z++;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;const len=Math.hypot(x,z)||1;x/=len;z/=len;const dx=(x*Math.cos(yaw)+z*Math.sin(yaw))*dt*6,dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*dt*6;player.position.x=T.MathUtils.clamp(player.position.x+dx,-45,45);player.position.z=T.MathUtils.clamp(player.position.z+dz,-45,45);if((x||z)&&seated){returnToWalking()}if(x||z)player.rotation.y=Math.atan2(dx,dz);const target=overview?new T.Vector3(0,30,34):new T.Vector3(player.position.x+Math.sin(yaw)*10,player.position.y+10,player.position.z+Math.cos(yaw)*15);c.position.lerp(target,.08);if(overview)c.lookAt(0,1,-9);else c.lookAt(player.position.x,player.position.y+4.8,player.position.z-7);updateAvatarTags();if(lastSeatPointer&&!modal.classList.contains('show'))showSeatHover(lastSeatPointer);r.render(s,c)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
