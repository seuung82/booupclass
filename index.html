function paintAffiliateScreen(){const ctx=threadBoardCanvas.getContext('2d');ctx.fillStyle='#102e42';ctx.fillRect(0,0,1024,576);ctx.fillStyle='#9fe9f7';ctx.font='bold 42px sans-serif';ctx.fillText('오늘의 사진 · 스레드 글쓰기 예시',34,60);const item=affToday();if(!item){ctx.fillStyle='white';ctx.font='bold 34px sans-serif';ctx.fillText('아직 등록된 사진이 없습니다',45,245);ctx.font='25px sans-serif';ctx.fillText('관리자가 글쓰기 사진을 등록하면',45,315);ctx.fillText('이 화면에 사진과 스레드 예시가 표시됩니다',45,355)}else{const url=affImage(item);if(!paintAffiliateScreen.cache||paintAffiliateScreen.cache.src!==url){paintAffiliateScreen.cache=new Image();paintAffiliateScreen.cache.crossOrigin='anonymous';paintAffiliateScreen.cache.onload=()=>paintAffiliateScreen();paintAffiliateScreen.cache.onerror=()=>{const c=threadBoardCanvas.getContext('2d');c.fillStyle='#f4d6b0';c.font='23px sans-serif';c.fillText('사진을 불러오지 못했습니다. 관리자에게 문의하세요.',42,470);threadBoardTexture.needsUpdate=true};paintAffiliateScreen.cache.src=url}const loaded=paintAffiliateScreen.cache;if(loaded.complete&&loaded.naturalWidth){const scale=Math.min(435/loaded.naturalWidth,385/loaded.naturalHeight);const w=loaded.naturalWidth*scale,hh=loaded.naturalHeight*scale;ctx.fillStyle='#1c4357';ctx.fillRect(28,93,455,400);ctx.drawImage(loaded,28+(455-w)/2,93+(400-hh)/2,w,hh)}ctx.fillStyle='#d1f5ff';ctx.font='bold 27px sans-serif';ctx.fillText('✍️ 스레드 글 샘플',515,118);const sample=(item.draft&&item.draft.trim().length>35?item.draft:'이 사진, 그냥 지나치기 아깝지 않아?\n\n일상에서 눈길이 가는 한 장면.\n여러분이라면 어떤 이야기를 붙일래?\n\n댓글로 생각을 나눠줘!');const lines=sample.split(/\n/);const width=460;const output=[];ctx.font='25px sans-serif';for(const line of lines){if(!line.trim()){output.push('');continue}let buf='';for(const char of line){if(ctx.measureText(buf+char).width>width&&buf){output.push(buf);buf=char}else buf+=char}if(buf)output.push(buf)}ctx.fillStyle='#fff';let y=167;for(const line of output.slice(0,9)){if(y>445)break;ctx.fillText(line,515,y);y+=35}ctx.fillStyle='#a8dfed';ctx.font='bold 23px sans-serif';ctx.fillText('화면 클릭 → 글쓰기 · 회원 투표',515,522)}threadBoardTexture.needsUpdate=true}

function paintThreadBoard(){if(currentUser){paintAffiliateScreen();return}const ctx=threadBoardCanvas.getContext('2d');ctx.fillStyle='#102f44';ctx.fillRect(0,0,1024,576);ctx.fillStyle='#9ee9f7';ctx.font='bold 50px sans-serif';ctx.fillText('💬 4시간 Threads 피드백',40,83);const p=activeThread();const url=p?.url||FEATURED_THREAD;ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText(p?'현재 소개 중인 회원 게시글':'첫 번째 추천 Threads 글',42,185);ctx.font='29px sans-serif';ctx.fillStyle='#b6e8ff';ctx.fillText(url.slice(0,49),42,256);ctx.fillText(url.slice(49,97),42,305);ctx.fillStyle='#ffffff';ctx.font='27px sans-serif';ctx.fillText(p?'종료: '+new Date(p.display_end).toLocaleString('ko-KR'):'회원이 신청하면 4시간씩 순서대로 소개돼요',42,400);ctx.fillText('클릭해서 글 보기 · 댓글은 게시판에서',42,475);threadBoardTexture.needsUpdate=true}
async function loadClassroomPosts(){if(!currentUser){classroomPosts=[];classroomComments=[];paintThreadBoard();return}const {data,error}=await db.from('classroom_threads_posts').select('id,user_id,url,created_at,display_start,display_end').order('display_start',{ascending:true}).limit(100);if(error){console.warn('게시글 조회 실패',error.message);return}classroomPosts=data||[];const ids=classroomPosts.map(p=>p.id);if(ids.length){const r=await db.from('classroom_thread_comments').select('id,post_id,user_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(300);classroomComments=r.data||[]}else classroomComments=[];paintThreadBoard();renderClassroomPosts()}
