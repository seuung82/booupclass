<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부러업지? BOOUP CLASS</title><style>@import url('https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap');*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#102b3a;color:white;overflow:hidden}canvas{display:block}header{position:fixed;z-index:5;top:0;left:0;right:0;padding:8px 18px 10px;background:linear-gradient(180deg,#172c44f5,#172c44dc);border-bottom:1px solid #ffffff33;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 9px #000}header strong{font-size:clamp(17px,2vw,23px)}header small{display:none}.tag{background:#182e48d9;border-radius:18px;padding:10px;font-size:12px}.buttons{position:fixed;right:12px;bottom:18px;display:grid;gap:8px}button{border:1px solid #c5e7ff77;background:#173b5cdd;color:white;border-radius:14px;padding:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}.help{position:fixed;bottom:16px;left:16px;max-width:310px;background:#173b5cdd;border-radius:16px;padding:12px;font-size:12px;line-height:1.6}.pad{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;grid-template-columns:repeat(3,46px);gap:4px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}#modal{position:fixed;inset:0;background:#041525e8;display:none;place-items:center;padding:20px}#modal.show{display:grid}.dialog{background:#16354b;border-radius:20px;padding:16px;width:min(900px,96vw)}iframe{width:100%;height:min(54vw,490px);border:0;border-radius:12px}.dialog input{width:100%;padding:12px;background:#28475a;border:1px solid #90bcd2;color:white;border-radius:9px}.dialog a{color:#8ee8ff;word-break:break-all}.dialog p{font-size:13px}@media(max-width:700px){.pad{display:grid;bottom:105px}.help{font-size:10p ud"></div><div class="help">🏛️ <b>자연 속 열린 강당</b><br>왼쪽 스크린: 강의 영상<br>오른쪽 스크린: 게시글 토론<br>※ 현재는 1인 3D 체험판입니다.</div><div class="buttons"><button id="seat">🪑 좌석 앉기</button><button id="lessons">🌱 내 레벨 · 강의실</button><button id="watch">▶ 강의 시청</button><button id="posts">💬 게시글 토론</button><button id="overview">◎ 전체 보기</button><button id="home">⌂ 시작 위치</button></div><div class="pad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div id="modal"><div class="dialog"><button id="close" style="float:right">닫기 ✕</button><h3 id="heading"></h3><div id="content"></div></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const s=new T.Scene();s.background=new T.Color(0xa5d8e4);s.fog=new T.FogExp2(0xa5d8e4,.012);const c=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,300),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.shadowMap.enabled=true;document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xeaffff,0x648f75,2.2));const light=new T.DirectionalLight(0xffefca,2.8);light.position.set(-20,35,25);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-60;light.shadow.camera.right=60;light.shadow.camera.top=60;light.shadow.camera.bottom=-60;s.add(light);
const m=x=>new T.MeshStandardMaterial({color:x,roughness:.85}),green=m(0x78bd85),stone=m(0xe6d6b6),wood=m(0x9b7054),dark=m(0x634f4d),pink=m(0xffa8ca),leaf=m(0x42a36d),water=new T.MeshStandardMaterial({color:0x4fc6d8,transparent:true,opacity:.82,roughness:.2});function cube(w,h,d,mat,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;s.add(o);return o}function cylinder(rt,rb,h,mat,x,y,z){const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,48),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;s.add(o);return o}function ball(rad,mat,x,y,z){const o=new T.Mesh(new T.SphereGeometry(rad,12,10),mat);o.position.set(x,y,z);o.castShadow=true;s.add(o);return o}
function label(str,x,y,z,w=10,h=2.5){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=256;const ctx=canvas.getContext('2d');ctx.fillStyle='#142a50';ctx.fillRect(0,0,1024,256);ctx.fillStyle='white';ctx.font='bold 70px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(str,512,128);const tex=new T.CanvasTexture(canvas);tex.colorSpace=T.SRGBColorSpace;const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide}));p.position.set(x,y,z);s.add(p)}
cube(180,.5,180,green,0,-.4,0);cylinder(25,25,.65,stone,0,.05,-5);cylinder(23.5,23.5,.08,wood,0,.41,-5);cylinder(18,18,.1,stone,0,.5,-7);
for(let ring=0;ring<3;ring++){const n=19+ring*6,R=9.5+ring*3.1;for(let j=0;j<n;j++){const a=j/n*Math.PI*2,x=Math.sin(a)*R,z=-7+Math.cos(a)*R;if(z< -10)continue;const o=cube(1.65,.45,.9,ring%2?pink:m(0x89c2d5),x,.88+ring*.2,z);o.rotation.y=a;const b=cube(1.65,.9,.16,dark,x,1.4+ring*.2,z+.4);b.rotation.y=a}}
cube(25,.8,6,dark,0,.85,-20);for(const x of [-12.5,12.5]){cylinder(.35,.45,7,wood,x,4.5,-23);ball(.85,m(0xffe2a6),x,8.4,-23)}
function screen(x,name,col){cube(11.2,6.5,.7,dark,x,5,-23);cube(10.5,5.9,.1,m(col),x,5,-22.59);label(name,x,5,-22.5,9,2.4)}screen(-6.5,'▶ 랜덤 강의',0x22567a);screen(6.5,'💬 게시글 토론',0x3c6d73);/* Stage signage is shown in fixed UI to prevent cropping */

for(let i=0;i<90;i++){const a=i*2.399,R=23+(i%11)*2.8;ball(.16+(i%3)*.06,i%2?pink:m(0xffe49a),Math.cos(a)*R,.5,Math.sin(a)*R-5)}
for(const x of [-25,25]){cylinder(5,5,.12,stone,x,.1,-12);cylinder(4.7,4.7,.08,water,x,.19,-12);for(let j=0;j<8;j++)ball(.12,m(0xffffff),x+Math.cos(j)*3,.35,-12+Math.sin(j)*3)}
function person(x,z,color){const group=new T.Group(),outfit=m(color),skin=m(0xffd6b6),hair=m([0x382a29,0x6c4635,0x282c3e,0x80583d][Math.abs(Math.floor(x*13+z*7))%4]),shoe=m(0xf9f3ec);function part(geometry,material,px,py,pz,scale){const o=new T.Mesh(geometry,material);o.position.set(px,py,pz);if(scale)o.scale.set(...scale);o.castShadow=true;group.add(o);return o}const sphere=new T.SphereGeometry(1,18,14);part(sphere,outfit,0,1.12,0,[.47,.57,.33]);part(sphere,skin,0,2.03,0,[.66,.64,.6]);part(sphere,hair,0,2.45,-.08,[.7,.32,.65]);part(sphere,hair,-.56,2.13,-.05,[.2,.42,.49]);part(sphere,hair,.56,2.13,-.05,[.2,.42,.49]);for(const side of [-1,1]){part(sphere,outfit,side*.53,1.17,.02,[.19,.41,.22]);part(sphere,skin,side*.56,.79,.04,[.17,.17,.17]);part(sphere,m(0x50627b),side*.24,.44,.02,[.2,.39,.22]);part(sphere,shoe,side*.24,.16,.19,[.23,.15,.36]);part(sphere,m(0x28232e),side*.23,2.06,.535,[.075,.105,.055]);part(sphere,m(0xffffff),side*.23-.02,2.1,.585,[.026,.03,.016]);part(sphere,m(0xf7a6a3),side*.45,1.91,.47,[.13,.075,.045])}part(sphere,m(0x8a4a4e),0,1.83,.59,[.12,.035,.03]);group.position.set(x,.3,z);s.add(group);return group}for(let ring=0;ring<3;ring++){const n=19+ring*6,R=9.5+ring*3.1;let seated=0;for(let j=0;j<n;j++){const a=j/n*Math.PI*2,x=Math.sin(a)*R,z=-7+Math.cos(a)*R;if(z< -10||j%3!==0)continue;const p=person(x, z, ['#a4ceff','#f4b0c2','#f4dc8a','#b9a6e8','#a4e6b2'][seated%5]);p.scale.setScalar(.55);p.position.y=.6+ring*.2;p.position.z+=.12;p.rotation.y=Math.PI;seated++}} const player=person(0,15,'#75d0ee'),keys=new Set();let yaw=0,drag=false,prev=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));r.domElement.addEventListener('pointerdown',e=>{drag=true;prev=e.clientX});addEventListener('pointerup',()=>drag=false);r.domElement.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-prev)*.005;prev=e.clientX}});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});
const modal=document.getElementById('modal');function open(title,html){document.getElementById('heading').textContent=title;document.getElementById('content').innerHTML=html;modal.classList.add('show')}document.getElementById('close').onclick=()=>modal.classList.remove('show');const LESSON_COUNT=36;let progress;try{progress=JSON.parse(localStorage.getItem('booupclass-learning-v1'))||{level:1,xp:0,done:[]}}catch{progress={level:1,xp:0,done:[]}}progress.level=Math.min(LESSON_COUNT,Math.max(1,Number(progress.level)||1));if(!Array.isArray(progress.done))progress.done=[];let seated=false;function saveLearning(){localStorage.setItem('booupclass-learning-v1',JSON.stringify(progress));refreshLearning()}function refreshLearning(){document.getElementById('learnhud').innerHTML='<b>🌱 Lv.'+progress.level+'</b> · '+progress.xp+' XP<small>'+(seated?'🪑 착석 중':'🚶 이동 중')+' · '+progress.done.length+'강 학습 완료</small>'}refreshLearning();document.getElementById('seat').onclick=()=>{seated=!seated;document.getElementById('seat').textContent=seated?'🚶 자리에서 일어나기':'🪑 좌석 앉기';refreshLearning();if(seated){player.position.set(0,.55,6);open('🪑 학습 좌석에 앉았어요','<p class="notice">좌석에 앉은 상태에서 강의를 시청하고 확인 퀴즈를 풀면 다음 레벨이 열립니다. 단순 착석만으로 경험치는 지급되지 않습니다.</p><button id="openLessons">강의 목록 보기</button>')}};function lessonPanel(){let html='<p class="notice">Lv.'+progress.level+' · 총 '+LESSON_COUNT+'강 중 '+progress.level+'강까지 열림. 현재는 1강 영상만 연결된 체험판이며 나머지 강의 영상은 관리자 등록 후 재생됩니다.</p>';for(let i=1;i<=LESSON_COUNT;i++){const unlocked=i<=progress.level;html+='<div class="lesson"><span>'+(progress.done.includes(i)?'✅ ':unlocked?'▶ ':'🔒 ')+i+'강'+(i===1?' · 샘플 영상':' · 영상 등록 예정')+'</span><button data-lesson="'+i+'" '+(!unlocked?'disabled':'')+'>'+(unlocked?'보기':'잠김')+'</button></div>'}open('🌱 레벨별 강의실',html)}document.getElementById('lessons').onclick=lessonPanel;document.addEventListener('click',e=>{if(e.target.id==='openLessons')lessonPanel();const n=Number(e.target.dataset?.lesson);if(!n)return;if(n>progress.level)return;if(!seated){open('🪑 먼저 좌석에 앉아주세요','<p>학습 보상은 좌석에 앉은 상태에서 진행할 수 있어요.</p>');return}if(n!==1){open(n+'강 · 준비 중','<p class="notice">이 강의의 실제 영상은 아직 등록되지 않았습니다. 영상과 학습 확인 기능이 준비되면 이용할 수 있습니다.</p>');return}open('1강 · 학습하기','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상 시청 후 아래 확인 퀴즈를 풀어 주세요. 현재 시청 완료 자동 검증은 없는 체험판입니다.</p><button id="quizStart">학습 확인 퀴즈</button>')});document.addEventListener('click',e=>{if(e.target.id!=='quizStart')return;open('1강 학습 확인','<p>다음 강의를 열려면 어떤 활동을 해야 할까요?</p><button class="choice" data-answer="wrong">좌석에 앉기만 한다</button><button class="choice" data-answer="correct">강의를 공부하고 확인 퀴즈를 완료한다</button>')});document.addEventListener('click',e=>{if(!e.target.dataset?.answer)return;if(e.target.dataset.answer==='wrong'){alert('다시 생각해 봐! 실제 학습 확인이 필요해.');return}if(!progress.done.includes(1)){progress.done.push(1);progress.xp+=50;progress.level=Math.max(progress.level,2);saveLearning()}open('🎉 Lv.'+progress.level+' 달성!','<p>1강 학습 확인을 완료했어! +50 XP</p><p>2강이 해제되었지만 영상은 아직 등록 전이야.</p><button id="openLessons">강의 목록 보기</button>')});document.getElementById('watch').onclick=()=>open('▶ 강의 시청','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상이 보이지 않으면 구글 드라이브 공유 권한을 확인하세요. 현재는 팝업 재생 테스트이며 24시간 동기화는 미구현입니다.</p>');document.getElementById('posts').onclick=()=>open('💬 게시글 피드백','<p>반응이 없었던 스레드 게시글 주소를 입력해 주세요. 현재는 브라우저 내 임시 목록입니다.</p><input id="postUrl" placeholder="https://www.threads.net/..." /><p><button id="addPost">등록하기</button></p><div id="postList"></div>');let overview=false;document.getElementById('overview').onclick=()=>{overview=!overview;document.getElementById('overview').textContent=overview?'↩ 아바타 따라가기':'◎ 전체 보기'};document.getElementById('home').onclick=()=>{player.position.set(0,.5,15);yaw=0;overview=false;document.getElementById('overview').textContent='◎ 전체 보기'};document.addEventListener('click',e=>{if(e.target.id!=='addPost')return;const input=document.getElementById('postUrl');let u;try{u=new URL(input.value);if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname))throw 0}catch{alert('올바른 스레드 링크를 입력하세요.');return}const p=document.createElement('p'),a=document.createElement('a');a.href=u.href;a.textContent=u.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a);document.getElementById('postList').prepend(p);input.value=''});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let x=0,z=0;if(keys.has('w')||keys.has('arrowup'))z--;if(keys.has('s')||keys.has('arrowdown'))z++;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;const len=Math.hypot(x,z)||1;x/=len;z/=len;const dx=(x*Math.cos(yaw)+z*Math.sin(yaw))*dt*6,dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*dt*6;player.position.x=T.MathUtils.clamp(player.position.x+dx,-45,45);player.position.z=T.MathUtils.clamp(player.position.z+dz,-45,45);if(x||z)player.rotation.y=Math.atan2(dx,dz);const target=overview?new T.Vector3(0,30,34):new T.Vector3(player.position.x+Math.sin(yaw)*9,player.position.y+7,player.position.z+Math.cos(yaw)*11);c.position.lerp(target,.08);if(overview)c.lookAt(0,1,-9);else c.lookAt(player.position.x,player.position.y+1.2,player.position.z-1);r.render(s,c)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
