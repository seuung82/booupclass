<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부러업지? BOOUP CLASS</title><style>@import url('https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap');*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#102b3a;color:white;overflow:hidden}canvas{display:block}header{position:fixed;z-index:5;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 9px #000}header strong{font-size:clamp(18px,3vw,32px)}header small{display:block}.tag{background:#182e48d9;border-radius:18px;padding:10px;font-size:12px}.buttons{position:fixed;right:12px;bottom:18px;display:grid;gap:8px}button{border:1px solid #c5e7ff77;background:#173b5cdd;color:white;border-radius:14px;padding:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}.help{position:fixed;bottom:16px;left:16px;max-width:310px;background:#173b5cdd;border-radius:16px;padding:12px;font-size:12px;line-height:1.6}.pad{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;grid-template-columns:repeat(3,46px);gap:4px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}#modal{position:fixed;inset:0;background:#041525e8;display:none;place-items:center;padding:20px}#modal.show{display:grid}.dialog{background:#16354b;border-radius:20px;padding:16px;width:min(900px,96vw)}iframe{width:100%;height:min(54vw,490px);border:0;border-radius:12px}.dialog input{width:100%;padding:12px;background:#28475a;border:1px solid #90bcd2;color:white;border-radius:9px}.dialog a{color:#8ee8ff;word-break:break-all}.dialog p{font-size:13px}@media(max-width:700px){.pad{display:grid;bottom:105px}.help{font-size:10px;max-width:52%}.buttons button{font-size:11px;padding:10px}.tag{display:none}}.stagebrand{position:fixed;z-index:4;top:6px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;text-shadow:0 2px 9px #18304e}.stagebrand span{display:block;font-family:"Nanum Brush Script",cursive;font-size:clamp(30px,3.5vw,55px);line-height:.85;color:#ffe4a2}.stagebrand b{font-size:clamp(14px,1.6vw,24px);color:#fff}@media(max-width:900px){.stagebrand{top:105px}.stagebrand span{font-size:32px}.stagebrand b{font-size:13px}}@media(min-width:901px){header>div:first-child{max-width:36%}}@media(max-width:700px){header>div:first-child>div{font-size:33px!important}header strong{font-size:16px}} </style></head><body><header><div><div style="font-family:&quot;Nanum Brush Script&quot;,cursive;font-style:normal;font-size:clamp(42px,5vw,70px);font-weight:400;color:#ffe4a2;letter-spacing:1px;transform:rotate(-3deg);margin:0 0 4px 12px;text-shadow:0 3px 12px #251234,0 0 18px #452557;line-height:1.1;display:block">수퍼이끌림</div><strong>🌱 부러업지? <span style="color:#9fe7ff">BOOUP CLASS</span></strong><small>자연 속 3D 부업 캠퍼스 · 체험판</small></div><span class="tag">WASD / 방향키 이동 · 드래그로 시점 회전</span></header><div class="stagebrand"><span>수퍼이끌림</span><b>부러업지? BOOUP CLASS</b></div><div class="help">🏛️ <b>자연 속 열린 강당</b><br>왼쪽 스크린: 강의 영상<br>오른쪽 스크린: 게시글 토론<br>※ 현재는 1인 3D 체험판입니다.</div><div class="buttons"><button id="watch">▶ 강의 시청</button><button id="posts">💬 게시글 토론</button><button id="home">⌂ 시작 위치</button></div><div class="pad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div id="modal"><div class="dialog"><button id="close" style="float:right">닫기 ✕</button><h3 id="heading"></h3><div id="content"></div></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const s=new T.Scene();s.background=new T.Color(0xa5d8e4);s.fog=new T.FogExp2(0xa5d8e4,.012);const c=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,300),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.shadowMap.enabled=true;document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xeaffff,0x648f75,2.2));const light=new T.DirectionalLight(0xffefca,2.8);light.position.set(-20,35,25);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-60;light.shadow.camera.right=60;light.shadow.camera.top=60;light.shadow.camera.bottom=-60;s.add(light);
const m=x=>new T.MeshStandardMaterial({color:x,roughness:.85}),green=m(0x78bd85),stone=m(0xe6d6b6),wood=m(0x9b7054),dark=m(0x634f4d),pink=m(0xffa8ca),leaf=m(0x42a36d),water=new T.MeshStandardMaterial({color:0x4fc6d8,transparent:true,opacity:.82,roughness:.2});function cube(w,h,d,mat,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;s.add(o);return o}function cylinder(rt,rb,h,mat,x,y,z){const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,48),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;s.add(o);return o}function ball(rad,mat,x,y,z){const o=new T.Mesh(new T.SphereGeometry(rad,12,10),mat);o.position.set(x,y,z);o.castShadow=true;s.add(o);return o}
function label(str,x,y,z,w=10,h=2.5){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=256;const ctx=canvas.getContext('2d');ctx.fillStyle='#142a50';ctx.fillRect(0,0,1024,256);ctx.fillStyle='white';ctx.font='bold 70px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(str,512,128);const tex=new T.CanvasTexture(canvas);tex.colorSpace=T.SRGBColorSpace;const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide}));p.position.set(x,y,z);s.add(p)}
cube(180,.5,180,green,0,-.4,0);cylinder(25,25,.65,stone,0,.05,-5);cylinder(23.5,23.5,.08,wood,0,.41,-5);cylinder(18,18,.1,stone,0,.5,-7);
for(let ring=0;ring<3;ring++){const n=19+ring*6,R=9.5+ring*3.1;for(let j=0;j<n;j++){const a=j/n*Math.PI*2,x=Math.sin(a)*R,z=-7+Math.cos(a)*R;if(z< -10)continue;const o=cube(1.65,.45,.9,ring%2?pink:m(0x89c2d5),x,.88+ring*.2,z);o.rotation.y=a;const b=cube(1.65,.9,.16,dark,x,1.4+ring*.2,z+.4);b.rotation.y=a}}
cube(25,.8,6,dark,0,.85,-20);for(const x of [-12.5,12.5]){cylinder(.35,.45,7,wood,x,4.5,-23);ball(.85,m(0xffe2a6),x,8.4,-23)}
function screen(x,name,col){cube(11.2,6.5,.7,dark,x,5,-23);cube(10.5,5.9,.1,m(col),x,5,-22.59);label(name,x,5,-22.5,9,2.4)}screen(-6.5,'▶ 랜덤 강의',0x22567a);screen(6.5,'💬 게시글 토론',0x3c6d73);/* Stage signage is shown in fixed UI to prevent cropping */ document.fonts.ready.then(()=>{const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const ct=cv.getContext('2d');ct.clearRect(0,0,1024,256);ct.textAlign='center';ct.textBaseline='middle';ct.shadowColor='#3e235c';ct.shadowBlur=16;ct.lineWidth=5;ct.strokeStyle='#4a3067';ct.font='115px "Nanum Brush Script"';ct.strokeText('수퍼이끌림',512,130);ct.fillStyle='#ffe6a4';ct.fillText('수퍼이끌림',512,130);const texture=new T.CanvasTexture(cv);texture.colorSpace=T.SRGBColorSpace;const p=new T.Mesh(new T.PlaneGeometry(9.5,2.4),new T.MeshBasicMaterial({map:texture,transparent:true,side:T.DoubleSide,depthWrite:false}));p.position.set(0,9.9,-24.4);s.add(p)});
for(let i=0;i<72;i++){const a=i*2.399,R=28+(i%7)*3.5,x=Math.cos(a)*R,z=Math.sin(a)*R-5,h=3+(i%5)*.6;cylinder(.25,.4,h,wood,x,h/2,z);ball(2.1+(i%3)*.3,i%8===0?pink:leaf,x,h+1,z);ball(1.5,leaf,x-1,h+.6,z+.6)}
for(let i=0;i<90;i++){const a=i*2.399,R=23+(i%11)*2.8;ball(.16+(i%3)*.06,i%2?pink:m(0xffe49a),Math.cos(a)*R,.5,Math.sin(a)*R-5)}
for(const x of [-25,25]){cylinder(5,5,.12,stone,x,.1,-12);cylinder(4.7,4.7,.08,water,x,.19,-12);for(let j=0;j<8;j++)ball(.12,m(0xffffff),x+Math.cos(j)*3,.35,-12+Math.sin(j)*3)}
function person(x,z,color){const group=new T.Group(),outfit=m(color),skin=m(0xffd6b6),hair=m([0x382a29,0x6c4635,0x282c3e,0x80583d][Math.abs(Math.floor(x*13+z*7))%4]),shoe=m(0xf9f3ec);function part(geometry,material,px,py,pz,scale){const o=new T.Mesh(geometry,material);o.position.set(px,py,pz);if(scale)o.scale.set(...scale);o.castShadow=true;group.add(o);return o}const sphere=new T.SphereGeometry(1,18,14);part(sphere,outfit,0,1.12,0,[.47,.57,.33]);part(sphere,skin,0,2.03,0,[.66,.64,.6]);part(sphere,hair,0,2.45,-.08,[.7,.32,.65]);part(sphere,hair,-.56,2.13,-.05,[.2,.42,.49]);part(sphere,hair,.56,2.13,-.05,[.2,.42,.49]);for(const side of [-1,1]){part(sphere,outfit,side*.53,1.17,.02,[.19,.41,.22]);part(sphere,skin,side*.56,.79,.04,[.17,.17,.17]);part(sphere,m(0x50627b),side*.24,.44,.02,[.2,.39,.22]);part(sphere,shoe,side*.24,.16,.19,[.23,.15,.36]);part(sphere,m(0x28232e),side*.23,2.06,.535,[.075,.105,.055]);part(sphere,m(0xffffff),side*.23-.02,2.1,.585,[.026,.03,.016]);part(sphere,m(0xf7a6a3),side*.45,1.91,.47,[.13,.075,.045])}part(sphere,m(0x8a4a4e),0,1.83,.59,[.12,.035,.03]);group.position.set(x,.3,z);s.add(group);return group}for(let i=0;i<14;i++){const a=i*2.1,R=8+(i%3)*3;const p=person(Math.sin(a)*R,-7+Math.cos(a)*R,['#a4ceff','#f4b0c2','#f4dc8a','#b9a6e8'][i%4]);p.rotation.y=Math.PI+(i%5-2)*.2} const player=person(0,15,'#75d0ee'),keys=new Set();let yaw=0,drag=false,prev=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));r.domElement.addEventListener('pointerdown',e=>{drag=true;prev=e.clientX});addEventListener('pointerup',()=>drag=false);r.domElement.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-prev)*.005;prev=e.clientX}});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys.delete(k))});
const modal=document.getElementById('modal');function open(title,html){document.getElementById('heading').textContent=title;document.getElementById('content').innerHTML=html;modal.classList.add('show')}document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('watch').onclick=()=>open('▶ 강의 시청','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상이 보이지 않으면 구글 드라이브 공유 권한을 확인하세요. 현재는 팝업 재생 테스트이며 24시간 동기화는 미구현입니다.</p>');document.getElementById('posts').onclick=()=>open('💬 게시글 피드백','<p>반응이 없었던 스레드 게시글 주소를 입력해 주세요. 현재는 브라우저 내 임시 목록입니다.</p><input id="postUrl" placeholder="https://www.threads.net/..." /><p><button id="addPost">등록하기</button></p><div id="postList"></div>');document.getElementById('home').onclick=()=>{player.position.set(0,.5,15);yaw=0};document.addEventListener('click',e=>{if(e.target.id!=='addPost')return;const input=document.getElementById('postUrl');let u;try{u=new URL(input.value);if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname))throw 0}catch{alert('올바른 스레드 링크를 입력하세요.');return}const p=document.createElement('p'),a=document.createElement('a');a.href=u.href;a.textContent=u.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a);document.getElementById('postList').prepend(p);input.value=''});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let x=0,z=0;if(keys.has('w')||keys.has('arrowup'))z--;if(keys.has('s')||keys.has('arrowdown'))z++;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;const len=Math.hypot(x,z)||1;x/=len;z/=len;const dx=(x*Math.cos(yaw)+z*Math.sin(yaw))*dt*6,dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*dt*6;player.position.x=T.MathUtils.clamp(player.position.x+dx,-45,45);player.position.z=T.MathUtils.clamp(player.position.z+dz,-45,45);if(x||z)player.rotation.y=Math.atan2(dx,dz);const target=new T.Vector3(player.position.x+Math.sin(yaw)*9,player.position.y+7,player.position.z+Math.cos(yaw)*11);c.position.lerp(target,.08);c.lookAt(player.position.x,player.position.y+1.2,player.position.z-1);r.render(s,c)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
