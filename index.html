://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상 시청 후 아래 확인 퀴즈를 풀어 주세요. 현재 시청 완료 자동 검증은 없는 체험판입니다.</p><button id="quizStart">학습 확인 퀴즈</button>')});document.addEventListener('click',e=>{if(e.target.id!=='quizStart')return;open('1강 학습 확인','<p>다음 강의를 열려면 어떤 활동을 해야 할까요?</p><button class="choice" data-answer="wrong">좌석에 앉기만 한다</button><button class="choice" data-answer="correct">강의를 공부하고 확인 퀴즈를 완료한다</button>')});document.addEventListener('click',e=>{if(!e.target.dataset?.answer)return;if(e.target.dataset.answer==='wrong'){alert('다시 생각해 봐! 실제 학습 확인이 필요해.');return}if(!progress.done.includes(1)){progress.done.push(1);progress.xp+=50;progress.level=Math.max(progress.level,2);saveLearning()}open('🎉 Lv.'+progress.level+' 달성!','<p>1강 학습 확인을 완료했어! +50 XP</p><p>2강이 해제되었지만 영상은 아직 등록 전이야.</p><button id="openLessons">강의 목록 보기</button>')});document.getElementById('watch').onclick=()=>open('▶ 강의 시청','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상이 보이지 않으면 구글 드라이브 공유 권한을 확인하세요. 현재는 팝업 재생 테스트이며 24시간 동기화는 미구현입니다.</p>');document.getElementById('posts').onclick=()=>open('💬 게시글 피드백','<p>반응이 없었던 스레드 게시글 주소를 입력해 주세요. 현재는 브라우저 내 임시 목록입니다.</p><input id="postUrl" placeholder="https://www.threads.net/..." /><p><button id="addPost">등록하기</button></p><div id="postList"></div>');let overview=false;document.getElementById('overview').onclick=()=>{overview=!overview;document.getElementById('overview').textContent=overview?'↩ 아바타 따라가기':'◎ 전체 보기'};document.getElementById('home').onclick=()=>{player.position.set(0,.5,15);yaw=0;overview=false;document.getElementById('overview').textContent='◎ 전체 보기'};document.addEventListener('click',e=>{if(e.target.id!=='addPost')return;const input=document.getElementById('postUrl');let u;try{u=new URL(input.value);if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname))throw 0}ca
