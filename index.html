function lessonPanel(){let html='<p class="notice">Lv.'+progress.level+' · 총 '+LESSON_COUNT+'강 중 '+progress.level+'강까지 열림. 현재는 1강 영상만 연결된 체험판이며 나머지 강의 영상은 관리자 등록 후 재생됩니다.</p>';for(let i=1;i<=LESSON_COUNT;i++){const unlocked=i<=progress.level;html+='<div class="lesson"><span>'+(progress.done.includes(i)?'✅ ':unlocked?'▶ ':'🔒 ')+i+'강'+(i===1?' · 샘플 영상':' · 영상 등록 예정')+'</span><button data-lesson="'+i+'" '+(!unlocked?'disabled':'')+'>'+(unlocked?'보기':'잠김')+'</button></div>'}open('🌱 레벨별 강의실',html)}document.getElementById('lessons').onclick=lessonPanel;document.addEventListener('click',e=>{if(e.target.id==='openLessons')lessonPanel();const n=Number(e.target.dataset?.lesson);if(!n)return;if(n>progress.level)return;if(!seated){open('🪑 먼저 좌석에 앉아주세요','<p>학습 보상은 좌석에 앉은 상태에서 진행할 수 있어요.</p>');return}if(n!==1){open(n+'강 · 준비 중','<p class="notice">이 강의의 실제 영상은 아직 등록되지 않았습니다. 영상과 학습 확인 기능이 준비되면 이용할 수 있습니다.</p>');return}open('1강 · 학습하기','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상 시청 후 아래 확인 퀴즈를 풀어 주세요. 현재 시청 완료 자동 검증은 없는 체험판입니다.</p><button id="quizStart">학습 확인 퀴즈</button>')});document.addEventListener('click',e=>{if(e.target.id!=='quizStart')return;open('1강 학습 확인','<p>다음 강의를 열려면 어떤 활동을 해야 할까요?</p><button class="choice" data-answer="wrong">좌석에 앉기만 한다</button><button class="choice" data-answer="correct">강의를 공부하고 확인 퀴즈를 완료한다</button>')});document.addEventListener('click',e=>{if(!e.target.dataset?.answer)return;if(e.target.dataset.answer==='wrong'){alert('다시 생각해 봐! 실제 학습 확인이 필요해.');return}if(!progress.done.includes(1)){progress.done.push(1);progress.xp+=50;progress.level=Math.max(progress.level,2);saveLearning()}open('🎉 Lv.'+progress.level+' 달성!','<p>1강 학습 확인을 완료했어! +50 XP</p><p>2강이 해제되었지만 영상은 아직 등록 전이야.</p><button id="openLessons">강의 목록 보기</button>')});document.getElementById('watch').onclick=()=>open('▶ 강의 시청','<iframe allow="autoplay; fullscreen" allowfullscreen src="https://drive.google.com/file/d/1hNbguLQjgWB_3SI1aRfdwm6-av2UXQlc/preview"></iframe><p>영상이 보이지 않으면 구글 드라이브 공유 권한을 확인하세요. 현재는 팝업 재생 테스트이며 24시간 동기화는 미구현입니다.</p>');const lectureCanvas=document.createElement('canvas');lectureCanvas.width=1024;lectureCanvas.height=576;const lectureTexture=new T.CanvasTexture(lectureCanvas);lectureTexture.colorSpace=T.SRGBColorSpace;const lectureScreen=new T.Mesh(new T.PlaneGeometry(10.45,5.82),new T.MeshBasicMaterial({map:lectureTexture,side:T.DoubleSide}));lectureScreen.position.set(-6.5,5,-22.45);s.add(lectureScreen);const lc=lectureCanvas.getContext('2d');lc.fillStyle='#122b49';lc.fillRect(0,0,1024,576);lc.fillStyle='#a7edff';lc.font='bold 54px sans-serif';lc.fillText('▶ 부러업지 1강',60,95);lc.fillStyle='white';lc.font='bold 46px sans-serif';lc.fillText('강의 영상 시청하기',60,250);lc.font='30px sans-serif';lc.fillText('화면을 클릭하면 영상이 열립니다',60,325);lc.fillStyle='#6ac9e9';lc.beginPath();lc.arc(840,300,105,0,Math.PI*2);lc.fill();lc.fillStyle='#123047';lc.beginPath();lc.moveTo(817,244);lc.lineTo(817,356);lc.lineTo(899,300);lc.closePath();lc.fill();lectureTexture.needsUpdate=true;

const FEATURED_THREAD='https://www.threads.com/share/IipIUEuZs';let classroomPosts=[],classroomComments=[];const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function activeThread(){return classroomPosts.find(p=>p.display_start&&new Date(p.display_start)<=new Date()&&new Date(p.display_end)>new Date())||null}
function paintThreadBoard(){const ctx=threadBoardCanvas.getContext('2d');ctx.fillStyle='#102f44';ctx.fillRect(0,0,1024,576);ctx.fillStyle='#9ee9f7';ctx.font='bold 50px sans-serif';ctx.fillText('💬 4시간 Threads 피드백',40,83);const p=activeThread();const url=p?.url||FEATURED_THREAD;ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText(p?'현재 소개 중인 회원 게시글':'첫 번째 추천 Threads 글',42,185);ctx.font='29px sans-serif';ctx.fillStyle='#b6e8ff';ctx.fillText(url.slice(0,49),42,256);ctx.fillText(url.slice(49,97),42,305);ctx.fillStyle='#ffffff';ctx.font='27px sans-serif';ctx.fillText(p?'종료: '+new Date(p.display_end).toLocaleString('ko-KR'):'회원이 신청하면 4시간씩 순서대로 소개돼요',42,400);ctx.fillText('클릭해서 글 보기 · 댓글은 게시판에서',42,475);threadBoardTexture.needsUpdate=true}
async function loadClassroomPosts(){if(!currentUser){classroomPosts=[];classroomComments=[];paintThreadBoard();return}const {data,error}=await db.from('classroom_threads_posts').select('id,user_id,url,created_at,display_start,display_end').order('display_start',{ascending:true}).limit(100);if(error){console.warn('게시글 조회 실패',error.message);return}classroomPosts=data||[];const ids=classroomPosts.map(p=>p.id);if(ids.length){const r=await db.from('classroom_thread_comments').select('id,post_id,user_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true}).limit(300);classroomComments=r.data||[]}else classroomComments=[];paintThreadBoard();renderClassroomPosts()}
function renderClassroomPosts(){const list=document.getElementById('postList');if(!list)return;list.replaceChildren();const active=activeThread();for(const p of classroomPosts){const row=document.createElement('div');row.style.cssText='padding:12px;margin:10px 0;border:1px solid #6397a8;border-radius:10px';const state=p.id===active?.id?'🔴 현재 전시 중':new Date(p.display_end)<=new Date()?'완료':'⏳ 대기 중';const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🧵 '+p.url;row.append(document.createTextNode(state+' · '+new Date(p.display_start).toLocaleString('ko-KR')+' ~ '+new Date(p.display_end).toLocaleString('ko-KR')),document.createElement('br'),a);for(const c of classroomComments.filter(c=>c.post_id===p.id)){const line=document.createElement('p');line.textContent='💬 '+c.body;row.append(line)}if(p.id===active?.id){const input=document.createElement('input');input.placeholder='응원이나 피드백 댓글 (500자 이내)';input.maxLength=500;input.dataset.commentInput=String(p.id);const btn=document.createElement('button');btn.textContent='댓글 남기기';btn.dataset.commentPost=String(p.id);row.append(input,btn)}list.append(row)}if(!classroomPosts.length)list.textContent='신청된 게시글이 없습니다. 위 링크는 운영자가 추천한 첫 글입니다.'}
document.getElementById('posts').onclick=async()=>{if(!currentUser){authView();return}open('💬 Threads 4시간 피드백','<p>게시글은 선착순으로 4시간씩 전시돼요. 다른 회원은 게시판에서 댓글을 남길 수 있습니다.</p><input id="postUrl" placeholder="https://www.threads.com/..." /><p><button id="addPost">선착순 전시 신청</button></p><p id="postFeedback"></p><div id="postList"></div>');await loadClassroomPosts()};
document.addEventListener('click',async e=>{if(e.target.id==='addPost'){const input=document.getElementById('postUrl'),feedback=document.getElementById('postFeedback');if(!input||!currentUser)return;let u;try{u=new URL(input.value.trim());if(u.protocol!=='https:'||!['threads.net','www.threads.net','threads.com','www.threads.com'].includes(u.hostname)||u.pathname==='/')throw 0}catch{feedback.textContent='올바른 Threads 링크를 입력해 주세요.';return}e.target.disabled=true;const {error}=await db.rpc('submit_classroom_thread',{p_url:u.href});e.target.disabled=false;feedback.textContent=error?'신청 실패: '+error.message:'신청 완료! 대기 순서에 따라 4시간씩 전시됩니다.';if(!error){input.value='';await loadClassroomPosts()}}const postId=e.target.dataset?.commentPost;if(postId&&currentUser){const input=document.querySelector('[data-comment-input="'+postId+'"]');const body=input?.value.trim();if(!body||body.length>500)return;e.target.disabled=true;const {error}=await db.from('classroom_thread_comments').insert({post_id:Number(postId),user_id:currentUser.id,body});e.target.disabled=false;if(error)alert('댓글 등록 실패: '+error.message);else await loadClassroomPosts()}});
const screenRay=new T.Raycaster(),screenPointer=new T.Vector2();r.domElement.addEventListener('click',e=>{if(document.getElementById('modal').classList.contains('show'))return;const rect=r.domElement.getBoundingClientRect();screenPointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1);screenRay.setFromCamera(screenPointer,c);const hit=screenRay.intersectObjects([lectureScreen,threadBoardMesh])[0];if(!hit)return;if(hit.object===lectureScreen)document.getElementById('watch').click();else{const url=activeThread()?.url||FEATURED_THREAD;open('💬 지금 전시 중인 Threads 글','<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Threads 원본 게시글 열기</a></p><p>회원 댓글과 다음 게시글 신청은 게시글 토론에서 확인하세요.</p><button id="goThreadBoard">💬 게시판 열기</button>')}});

let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let x=0,z=0;if(keys.has('w')||keys.has('arrowup'))z--;if(keys.has('s')||keys.has('arrowdown'))z++;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;const len=Math.hypot(x,z)||1;x/=len;z/=len;const dx=(x*Math.cos(yaw)+z*Math.sin(yaw))*dt*6,dz=(-x*Math.sin(yaw)+z*Math.cos(yaw))*dt*6;player.position.x=T.MathUtils.clamp(player.position.x+dx,-45,45);player.position.z=T.MathUtils.clamp(player.position.z+dz,-45,45);if((x||z)&&seated){returnToWalking()}if(x||z)player.rotation.y=Math.atan2(dx,dz);const target=overview?new T.Vector3(0,30,34):new T.Vector3(player.position.x+Math.sin(yaw)*10,player.position.y+10,player.position.z+Math.cos(yaw)*15);c.position.lerp(target,.08);if(overview)c.lookAt(0,1,-9);else c.lookAt(player.position.x,player.position.y+4.8,player.position.z-7);updateAvatarTags();if(lastSeatPointer&&!modal.classList.contains('show'))showSeatHover(lastSeatPointer);r.render(s,c)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
